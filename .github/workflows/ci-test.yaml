name: CI Test Workflow
env:
  SERVICE_NAME: ter
on:
  workflow_call:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install Dependencies
        run: npm ci --no-audit
      - name: Run Unit Tests
        run: npm run test
