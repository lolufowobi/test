name: run-all-cats

on: [ workflow_call ]

jobs:
  cat1:
    strategy:
      matrix:
        catType: [lion, tiger, panther, lynx]
    uses: './.github/workflows/run-cat-1.yaml'
    with:
      catType: ${{ matrix.catType }}
    secrets: inherit

  cat2:
    uses: './.github/workflows/run-cat-2.yaml'
    secrets: inherit
