name: run-all-cats

on: [ workflow_call ]

jobs:
  cat-dev:
    uses: ./.github/workflows/run-cat-dev.yaml
    secrets: inherit
  cat-prod:
    strategy:
      matrix:
        include:
          - catType: lion
            path: './somepath/lion'
          - catType: tiger
            path: './somepath/tiger'
    uses: ./.github/workflows/run-cat-prod.yaml
    with:
      catType: ${{ matrix.catType }}
      path: ${{ matrix.path }}
    secrets: inherit
