name: run-deployment-dev

on: [ workflow_call ]

jobs:


  run-deployments:

    runs-on: self-hosted
    environment: dev
    strategy:
      matrix:
        deploymentType: [v1,v2,v3,v4]
    outputs:
      deploymentName: ${{ steps.run-dev-deployments.outputs.deploymentName }}
      outcome: ${{ steps.run-dev-deployments.outcome }}
      channel: ${{ vars.CHANNEL_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Print job ID
        run: |
          echo "Job ID: ${{ github.job }}"

      - name: run-dev-deployments
        id: run-dev-deployments
        uses: ./.github/actions/name-generator
        with:
          deploymentType: ${{ matrix.deploymentType }}

  notify:
    needs: [ run-deployments ]
    if: always()
    uses: "./.github/workflows/slack-notify.yaml"
    with:
      deploymentName: ${{ needs.run-deployments.outputs.deploymentName }}
      generationOutcome: ${{ needs.run-deployments.outputs.outcome }}
      channel: ${{ needs.run-deployments.outputs.channel }}
