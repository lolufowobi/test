name: run-deployment-prod

on:
  workflow_call:
    inputs:
      deploymentType:
        type: string
      path:
        type: string

jobs:
  run-deployments:
    name: run-deployments-${{ inputs.deploymentType }}
    runs-on: self-hosted
    environment: prod

    outputs:
      deploymentOutput: ${{ steps.run-deployments.outputs.deploymentOutput }}
      outcome: ${{ steps.run-deployments.outcome }}
      channel: ${{ vars.CHANNEL_NAME }}

    steps:
      - uses: actions/checkout@v4
      - name: run-deployments
        id: run-deployments
        uses: ./.github/actions/name-generator
        with:
          deploymentType: ${{ inputs.deploymentType }}
          country: ${{ inputs.country }}

  notify:
    needs: [ run-deployments ]
    name: notify-${{ inputs.deploymentType }}
    if: always()
    uses: ./.github/workflows/slack-notify.yaml
    with:
      deploymentOutput: ${{ needs.run-deployments.outputs.deploymentOutput }}
      generationOutcome: ${{ needs.run-deployments.outputs.outcome }}
      channel: ${{ needs.run-deployments.outputs.channel }}
