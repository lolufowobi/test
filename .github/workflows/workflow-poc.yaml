name: auto-generate-job
on:
  push:
    branches:
      - main
    paths:
      - 'dev/team1/**'
  #just for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check_diff.outputs.has_changes }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: install yq
        run: sudo snap install yq

      - name: run creates.sh script
        run: ./dev/team1/create.sh


      - name: Git status
        run: |
          git status --porcelain

      - name: Check for changes
        id: check_diff
        run: |
          if [ -n "$(git diff HEAD^ HEAD)" ]; then
            echo "has_changes=true" >> $GITHUB_ENV
          else
            echo "has_changes=false" >> $GITHUB_ENV
          fi

      - name: Git commit and push
        if: steps.check-diff-exists.outputs.diff-exists == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "AUTOCOMMIT: Regenerate job manifest on site config changes"
          git push
